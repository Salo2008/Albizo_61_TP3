<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FerreteriaLuz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="publicidad">
      <!-- LOGO Y NOMBRE DE LA EMPRESA -->
      <div class="logo">
        <img src="img2/logosalo.png" alt="Logo FerreteriaLuz" />
        <h1 class="nombre-empresa">FerreteriaLuz</h1>
      </div>

      <!-- LINEAS DECORATIVAS -->
      <div class="lineas">
        <div></div>
        <div></div>
      </div>

      <!-- NOMBRE DEL PRODUCTO -->
      <div class="nombre-producto">Focos LED y lámparas</div>

      <!-- PRODUCTOS -->
      <div class="productos">
        <!-- COLUMNA IZQUIERDA -->
        <div class="columna-izquierda">
          <div class="imagen-foco">
            <img src="img2/focoled.png" alt="Foco LED" />
          </div>
        </div>

        <!-- COLUMNA DERECHA -->
        <div class="columna-derecha">
          <div class="imagen-lampara">
            <img src="img2/focoled2.png" alt="Lámpara" />
          </div>

          <div class="precio">$8.000</div>
        </div>
      </div>

      <!-- DESCUENTO -->
      <div class="descuento">
        <div class="porcentaje">10%</div>

        <div class="texto-descuento">
          Descuento llevando<br />
          3 o más
        </div>
      </div>
    </div>
  </body>
</html>
